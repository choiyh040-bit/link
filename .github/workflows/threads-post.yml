name: 스레드 예약 게시

on:
  schedule:
    - cron: "*/15 * * * *"   # 15분마다 예약 확인 (GitHub 사정으로 몇 분 늦을 수 있음)
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  contents: write   # 이미지를 images/ 에 저장
  issues: write     # 결과 댓글, 이슈 닫기

concurrency:
  group: threads-post   # 같은 글이 두 번 올라가지 않게 한 번에 하나만 실행
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 예약 글 게시
        run: python3 scripts/post_threads.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
